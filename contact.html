<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тамос бо Админ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050508;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: rgba(20, 20, 35, 0.8);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            backdrop-filter: blur(10px);
        }
        h2 {
            margin-bottom: 15px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }
        p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        .telegram {
            background: #0088cc;
            color: #fff;
        }
        .telegram:hover {
            background: #0099ee;
            transform: scale(1.03);
            box-shadow: 0 0 15px #0088cc;
        }
        .instagram {
            background: linear-divider;
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            color: #fff;
        }
        .instagram:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px #d6249f;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .back-btn:hover {
            color: #fff;
        }
        .contact-link-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 20px;
    background: rgba(0, 255, 204, 0.15);
    border: 2px solid #00ffcc;
    color: #fff;
    text-decoration: none;
    border-radius: 20px;
    font-weight: bold;
    backdrop-filter: blur(5px);
    z-index: 100;
    transition: 0.2s;
}
.contact-link-btn:hover {
    background: #00ffcc;
    color: #000;
    box-shadow: 0 0 10px #00ffcc;
}

    </style>
</head>
<body>

    <div class="container">
        <h2>Тамос бо Админ</h2>
        <p>Агар савол ё пешниҳоде доред, метавонед тавассути шабакаҳои иҷтимоӣ муроҷиат кунед:</p>

        <!-- Telegram -->
        <a href="https://t.me/iqbol_sharifov" target="_blank" class="social-btn telegram">
            Навиштан дар Telegram
        </a>

        <!-- Instagram -->
        <a href="https://instagram.com/Sharifov_Iqbol" target="_blank" class="social-btn instagram">
            Дидан дар Instagram
        </a>

        <br>
        <a href="index.html" class="back-btn">← Баргаштан ба саҳифаи асосӣ</a>
    </div>

</body>
</html>
