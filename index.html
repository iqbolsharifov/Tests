 $("cok").onclick=()=>{LS.set("consent",1);enter(auth.currentUser)}}

function errText(e){const c=e.code||"";
 if(c=="auth/invalid-credential"||c=="auth/wrong-password"||c=="auth/user-not-found")return "Логин ё парол нодуруст";
 if(c=="auth/email-already-in-use")return "Ин логин банд аст, дигарашро интихоб кунед";
 if(c=="auth/weak-password")return "Парол хеле кӯтоҳ аст";
 if(c=="auth/network-request-failed")return "Интернет нест";
 return "Хато: "+(c||e.message)}

function authScreen(mode){
 mode=mode||"in";
 app.innerHTML=`<h1>Викторина</h1>
 <div class="tabs"><button id="t1" class="chip ${mode=="in"?"on":""}">Ворид шудан</button><button id="t2" class="chip ${mode=="up"?"on":""}">Сабти ном</button></div>
 ${mode=="up"?`<input id="nm" placeholder="Ном ва насаб"><input id="sch" placeholder="Рақами муассиса" inputmode="numeric">`:""}
 <input id="lg" placeholder="Логин (ҳарфи лотинӣ ва рақам)" autocapitalize="off">
 <input id="pw" type="password" placeholder="Парол (камаш 6 аломат)">
 <p id="err" class="err"></p>
 <button class="go" id="ok">${mode=="in"?"Ворид шудан":"Сабт шудан"}</button>
 <p class="net">${navigator.onLine?"":"Интернет нест: сабти ном дар телефон нигоҳ дошта мешавад."}</p>`;
 $("t1").onclick=()=>authScreen("in");$("t2").onclick=()=>authScreen("up");
 $("ok").onclick=()=>submit(mode)}

async function submit(mode){
 const lg=$("lg").value.trim(),pw=$("pw").value,err=$("err");err.textContent="";
 if(!/^[a-z0-9_.]{3,20}$/i.test(lg)){err.textContent="Логин: 3-20 ҳарфи лотинӣ ё рақам";return}
 if(pw.length<6){err.textContent="Парол камаш 6 аломат бошад";return}
 try{
  if(mode=="in"){
   if(!navigator.onLine){err.textContent="Барои воридшавӣ интернет лозим аст";return}
   await signInWithEmailAndPassword(auth,mail(lg),pw);
  }else{
   const name=$("nm").value.trim(),school=$("sch").value.trim();
   if(!name||!school){err.textContent="Ном ва рақами муассисаро нависед";return}
   const d={name,school,login:lg.toLowerCase(),regAt:Date.now(),consentAt:Date.now()};
   if(!navigator.onLine)return offlineReg(d,pw);
   try{await register(d,pw);enter(auth.currentUser)}
   catch(e){if(e.code=="auth/network-request-failed")return offlineReg(d,pw);throw e}
  }
 }catch(e){err.textContent=errText(e)}}

async function register(d,pw){
 busy=true;
 try{
  const c=await createUserWithEmailAndPassword(auth,mail(d.login),pw);
  await setDoc(doc(db,"users",c.user.uid),{name:d.name,school:d.school,login:d.login,role:"student",testsCount:0,totalCorrect:0,weekCorrect:0,weekKey:0,streak:0,lastDay:0,photo:"",regAt:d.regAt,consentAt:d.consentAt||0});
 }finally{busy=false}}

function offlineReg(d,pw){
 const q=LS.get("pendReg",[]);
 if(q.some(x=>x.login==d.login)){$("err").textContent="Ин логин дар ин телефон аллакай ҳаст";return}
 q.push({...d,pw});LS.set("pendReg",q);
 prof={...d,local:true,testsCount:0,totalCorrect:0,photo:""};LS.set("localUser",prof);
 home()}

async function enter(u){
 if(!LS.get("consent",0)){consent();return}
 if(!u){prof=LS.get("localUser",null);if(prof){home();sync()}else authScreen();return}
 let p=null;
 try{const s=await getDoc(doc(db,"users",u.uid));
  if(!s.exists()||s.data().disabled){await signOut(auth);LS.set("prof:"+u.uid,null);alert("Ҳисоби шумо ғайрифаъол аст");authScreen();return}
  p=s.data();LS.set("prof:"+u.uid,p)}catch(e){}
 prof=p||LS.get("prof:"+u.uid,null);
  if(!prof){authScreen();return}
 await loadBank();
 home();sync()}

async function sync(){
 if(!navigator.onLine||syncing)return;syncing=true;
 try{
  const q=LS.get("pendReg",[]);
  if(!auth.currentUser&&q.length){
   const {pw,...d}=q[0];
   try{await register(d,pw);LS.set("pendReg",q.slice(1));LS.set("localUser",null);syncing=false;enter(auth.currentUser);return}
   catch(e){
    if(e.code=="auth/email-already-in-use"){LS.set("pendReg",q.slice(1));LS.set("localUser",null);alert("Логини "+d.login+" банд буд. Аз нав сабти ном кунед.");authScreen("up")}
    return}
  }
  const u=auth.currentUser;
  if(u&&prof&&!prof.local){
   for(const r of LS.get("resQ",[]).filter(x=>x.login==prof.login)){
    try{
     const {login,id,...rest}=r;
     const dn=dayN(r.ts),wn=weekN(dn),ld=prof.lastDay||0;
     const up={testsCount:increment(1),totalCorrect:increment(r.score)};
     if(prof.weekKey==wn)up.weekCorrect=increment(r.score);else{up.weekKey=wn;up.weekCorrect=r.score}
     if(dn==ld+1){up.streak=(prof.streak||0)+1;up.lastDay=dn}else if(dn>ld+1){up.streak=1;up.lastDay=dn}
     await addDoc(collection(db,"results"),{...rest,uid:u.uid});
     await updateDoc(doc(db,"users",u.uid),up);
     prof.testsCount=(prof.testsCount||0)+1;prof.totalCorrect=(prof.totalCorrect||0)+r.score;
     if(prof.weekKey==wn)prof.weekCorrect=(prof.weekCorrect||0)+r.score;else{prof.weekKey=wn;prof.weekCorrect=r.score}
     if(up.lastDay){prof.lastDay=up.lastDay;prof.streak=up.streak}
     LS.set("prof:"+u.uid,prof);
     LS.set("resQ",LS.get("resQ",[]).filter(x=>x.id!==id));
    }catch(e){break}
   }
  }
 }finally{syncing=false}}

function home(){
 const wait=LS.get("resQ",[]).filter(x=>x.login==prof.login).length,mc=getM().length;
 app.innerHTML=`<div class="me"><img src="${prof.photo||ph0}"><div><b>${esc(prof.name)}</b><br><small>Муассиса №${esc(prof.school)} · тестҳо: ${prof.testsCount||0} · 🔥 ${prof.streak||0}</small></div></div>
 <small>Шумораи савол дар як бозӣ:</small><div class="tabs" style="margin-top:6px">${[5,10,20].map(n=>`<button class="chip${N==n?" on":""}" data-n="${n}">${n}</button>`).join("")}</div>`;
 [...app.querySelectorAll(".chip")].forEach(b=>b.onclick=()=>{N=+b.dataset.n;LS.set("n",N);home()});
 SETS.forEach(s=>btn(`${s.t}<br><small>${s.q.length} савол</small>`,"",()=>start(s)));
 btn(`🔁 Хатоҳои ман${mc?" ("+mc+")":""}`,"",()=>{
  const r=sh(getM().map(t=>ALLQ.find(q=>q[0]==t)).filter(Boolean)).slice(0,N);
  if(!r.length){alert("Ҳоло хато нест. Офарин!");return}start(null,r)});
 btn("🏆 Рейтинг","",()=>board());btn("💬 Саволҳо","",forum);btn("📷 Акси профил","",pickPhoto);
 btn("Баромадан","",async()=>{LS.set("localUser",null);await signOut(auth).catch(()=>{});prof=null;authScreen();sync()});
 app.insertAdjacentHTML("beforeend",`<p class="net">${prof.local?"Ҳисоб дар интизори интернет аст. ":""}${wait?"Натиҷаҳои интизор: "+wait:""}</p>`)}

function start(s,custom){cur=s||{id:"r"};review=!!custom;round=custom||sh(s.q).slice(0,N);i=0;sc=0;log=[];ask()}

function ask(){
 const q=round[i];let done=false;
 app.innerHTML=`<small>${review?"Такрор · ":""}${i+1} / ${round.length} · Хол: ${sc}</small><div class="bar"><i style="width:${i/round.length*100}%"></i></div><h2>${esc(q[0])}</h2>`;
 sh(q.slice(1,5).map((t,n)=>[t,n==0])).forEach(o=>{
  const b=document.createElement("button");b.textContent=o[0];b.dataset.r=o[1]?1:0;
  b.onclick=()=>{if(done)return;done=true;
   log.push({q:q[0],a:o[0],ok:o[1]});
   if(o[1]){sc++;b.className="ok";delM(q[0])}else{b.className="no";addM(q[0])}
   [...app.querySelectorAll("button[data-r='1']")].forEach(x=>x.className="ok");
   if(q[5])app.insertAdjacentHTML("beforeend",`<div class="exp">💡 ${esc(q[5])}</div>`);
   const rp=btn("⚠️ Хато дар савол","flag",async()=>{
    try{await addDoc(collection(db,"reports"),{type:"question",text:q[0],uid:auth.currentUser.uid,name:prof.name,ts:Date.now()});rp.textContent="Фиристода шуд ✓";rp.disabled=true}
    catch(e){rp.textContent="Интернет лозим аст"}});
   btn(i<round.length-1?"Оянда":"Натиҷа","go",()=>{i++;i<round.length?ask():end()})};
  app.appendChild(b)})}

function end(){
 if(!review){
  const rq=LS.get("resQ",[]);
  rq.push({id:Date.now()+"-"+Math.random().toString(36).slice(2,7),login:prof.login,set:cur.id,score:sc,total:round.length,ts:Date.now(),answers:log});
  LS.set("resQ",rq);sync()}
 app.innerHTML=`<h1>${sc} / ${round.length}</h1><p>${sc==round.length?"Аъло!":sc>=round.length*0.6?"Хуб!":"Боз кӯшиш кунед"}</p>`;
 if(!review)btn("Аз нав","go",()=>start(cur));
 btn("Ба феҳрист","go",home)}

async function board(tab){
 tab=tab||"w";
 app.innerHTML=`<h1>🏆 Рейтинг</h1><div class="tabs"><button class="chip${tab=="w"?" on":""}" id="tw">Ин ҳафта</button><button class="chip${tab=="a"?" on":""}" id="ta">Умумӣ</button></div><p class="net" id="ld" style="margin-top:10px">Бор шуда истодааст...</p><div id="bl"></div>`;
 $("tw").onclick=()=>board("w");$("ta").onclick=()=>board("a");
 btn("Бозгашт","go",home);
 try{
  const f=tab=="w"?"weekCorrect":"totalCorrect",wk=weekN(dayN(Date.now()));
  const s=await getDocs(query(collection(db,"users"),orderBy(f,"desc"),limit(50)));
  let h="",n=0;
  s.forEach(d=>{const u=d.data();if(tab=="w"&&u.weekKey!=wk)return;const v=u[f]||0;if(!v)return;n++;if(n>20)return;
   h+=`<div class="row"><span class="n">${["🥇","🥈","🥉"][n-1]||n}</span><img src="${u.photo||ph0}"><div><b>${esc(u.name)}</b><br><small>Муассиса №${esc(u.school)} · тестҳо: ${u.testsCount||0}</small></div><b>${v}</b></div>`});
  $("ld").textContent=n?"Холи дуруст (ҷавобҳои дуруст)":"Ҳоло натиҷа нест";$("bl").innerHTML=h;
 }catch(e){$("ld").textContent="Интернет ва воридшавӣ лозим аст"}}

async function forum(){
 app.innerHTML=`<h1>💬 Саволҳо</h1><input id="px" maxlength="500" placeholder="Саволи худро нависед..."><p class="err" id="pe"></p><button class="go" id="ps">Фиристодан</button><div id="fl" class="net">Бор шуда истодааст...</div>`;
 btn("Бозгашт","",home);
 $("ps").onclick=async()=>{const t=$("px").value.trim();if(!t)return;
  if(BAD.some(w=>t.toLowerCase().includes(w.toLowerCase()))){$("pe").textContent="Паём калимаи манъшуда дорад";return}
  try{await addDoc(collection(db,"posts"),{uid:auth.currentUser.uid,name:prof.name,text:t,ts:Date.now()});forum()}
  catch(e){$("pe").textContent=e.code=="permission-denied"?"Навиштан барои шумо хомӯш карда шудааст":"Интернет лозим аст"}};
 const P=[];
 try{
  const s=await getDocs(query(collection(db,"posts"),orderBy("ts","desc"),limit(50)));
  s.forEach(d=>P.push({id:d.id,...d.data()}));
  $("fl").innerHTML=P.map((p,k)=>`<div class="row" style="display:block;color:#14263D"><b>${esc(p.name)}</b> <small>${new Date(p.ts).toLocaleString("ru-RU")}</small><br>${esc(p.text)}<br><button class="flag" data-k="${k}">🚩 Шикоят</button></div>`).join("")||"Ҳоло савол нест";
  [...document.querySelectorAll(".flag")].forEach(b=>b.onclick=async()=>{const p=P[+b.dataset.k];
   try{await addDoc(collection(db,"reports"),{type:"post",ref:p.id,text:String(p.text).slice(0,200),uid:auth.currentUser.uid,name:prof.name,ts:Date.now()});b.textContent="Фиристода шуд ✓";b.disabled=true}
   catch(e){b.textContent="Интернет лозим аст"}});
 }catch(e){$("fl").textContent="Интернет ва воридшавӣ лозим аст"}}

function pickPhoto(){
 const f=document.createElement("input");f.type="file";f.accept="image/*";
 f.onchange=()=>{const file=f.files[0];if(!file)return;
  const img=new Image();
  img.onload=async()=>{
   const c=document.createElement("canvas");c.width=c.height=96;
   const s=Math.min(img.width,img.height);
   c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,96,96);
   const url=c.toDataURL("image/jpeg",0.7);
   try{if(!auth.currentUser)throw 0;await updateDoc(doc(db,"users",auth.currentUser.uid),{photo:url});prof.photo=url;home()}
   catch(e){alert("Барои гузоштани акс воридшавӣ ва интернет лозим аст")}};
  img.src=URL.createObjectURL(file)};
 f.click()}

onAuthStateChanged(auth,u=>{if(!busy)enter(u)});
window.addEventListener("online",sync);
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
